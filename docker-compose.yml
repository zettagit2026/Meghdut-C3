# CEMA cUAS — One-command launcher (Windows + Linux + macOS)
# Boots MongoDB, FastAPI backend, and React frontend behind Nginx.
# Usage:
#   docker compose up --build   -> first run
#   docker compose up           -> subsequent runs
#   docker compose down         -> stop
#   docker compose down -v      -> stop AND wipe database
#
# SECURITY: this file intentionally ships with NO default secrets. Before
# `docker compose up`, create a `.env` file next to this file (already
# excluded by .gitignore — never commit it) defining at minimum:
#   JWT_SECRET=<output of: openssl rand -hex 32>
#   ADMIN_EMAIL=<real operator email>
#   ADMIN_PASSWORD=<a strong, non-default password>
#   IFF_BRIDGE_API_KEY=<output of: openssl rand -hex 32 -- also set identically
#     in field-bridge/iff_beacon_bridge.py's own env, see field-bridge/README.md>
#   CORS_ORIGINS=http://localhost:3000,http://<your-LAN-IP>:3000
# The backend fails fast at startup if any of these are unset or match a
# known placeholder/default value (see backend/server.py).

services:
  mongo:
    image: mongo:7
    container_name: cema-mongo
    restart: unless-stopped
    volumes:
      - cema_mongo_data:/data/db
    ports:
      # Bound to localhost only — this Mongo instance has no auth configured,
      # so it must never be reachable from other hosts on a shared LAN.
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cema-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "cema_cuas_db"
      # No defaults for these — they must come from your gitignored .env
      # file. See the note at the top of this file.
      CORS_ORIGINS: "${CORS_ORIGINS}"
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      # Separate trust boundary secret for POST /api/iff/beacons/ingest --
      # see backend/server.py's IFF_BRIDGE_API_KEY docstring. Must match the
      # value configured on the field-bridge/iff_beacon_bridge.py host.
      IFF_BRIDGE_API_KEY: "${IFF_BRIDGE_API_KEY}"
      # Shared bridge-identity secret gating the diagnostic bridge_hello
      # TX-consumer registration (see backend/server.py's BRIDGE_HELLO_TOKEN
      # docstring). MUST be listed here explicitly or the container never sees
      # it (Compose does NOT auto-inject top-level .env values -- same
      # deploy-incident note as SENSOR_LAT below). Optional: if unset the
      # backend fails CLOSED (bridge_hello refused, honest signal defaults to
      # "no TX bridge subscribed"); set the SAME value in the TX-bridge hosts'
      # .env to enable registration. Never gates/authorizes an actual transmit.
      CEMA_BRIDGE_TOKEN: "${CEMA_BRIDGE_TOKEN:-}"
      # Optional -- real surveyed sensor GPS coordinates for the Map page.
      # Unset by default (server.py treats missing/empty as "not configured"
      # and reports that honestly rather than falling back to a fake
      # coordinate). Compose does NOT auto-inject top-level .env values into
      # a container; they must be explicitly listed here to reach the app --
      # a real deploy incident where this line was missing meant .env alone
      # never actually took effect no matter how many times the container
      # was restarted.
      SENSOR_LAT: "${SENSOR_LAT:-}"
      SENSOR_LON: "${SENSOR_LON:-}"
      SENSOR_LABEL: "${SENSOR_LABEL:-}"
      # WiFi identification-confidence fusion (RF <-> Kismet 802.11 ground
      # truth). Default "true" for the demo; set to "false"/"0" in the .env
      # file (then `docker compose up -d backend`) to fully disable and restore
      # exact prior behavior on stage. Must be listed here explicitly -- Compose
      # does NOT auto-inject top-level .env values into the container (see the
      # SENSOR_LAT deploy-incident note above).
      DETECTION_WIFI_FUSION_ENABLED: "${DETECTION_WIFI_FUSION_ENABLED:-true}"
    volumes:
      # Container->host privilege bridge for the GUI TX-bridge SiK handoff
      # (POST /api/tx/online|standdown). The cema-tx-helper root daemon on the
      # HOST creates a Unix-domain control socket here; the backend connects to
      # it to trigger the ONLY three whitelisted `systemctl start/stop` calls
      # (cema-rf-bridge / cema-jam-bridge / cema-mavlink-sniffer). This is NOT a
      # Docker/systemctl handoff — see scripts/host-helper/README.md for the
      # exact security boundary. The helper must be installed + running on the
      # host (root) or these endpoints report "helper unavailable" honestly.
      # If /run/cema-tx-helper does not exist yet on the host, the helper's
      # systemd unit (RuntimeDirectory=) creates it; recreate the backend
      # container AFTER the helper is up so the mount is populated.
      - /run/cema-tx-helper:/run/cema-tx-helper
    ports:
      # Hotfix (task #95 regression): TLS cutover changed this from a
      # published port to `expose: 8001`, which closed backend:8001 to the
      # LAN (intended) but also broke the 4 bare-systemd field-bridge
      # services (hackrf_rx, ml_classify_bridge, fpv_video_bridge,
      # mavlink_sniffer) that run on the HOST and POST to
      # http://localhost:8001 via CEMA_API_URL. Binding to 127.0.0.1 only
      # restores host-local connectivity while keeping the port genuinely
      # unreachable from the LAN — mirrors the cema_mongo pattern below.
      - "127.0.0.1:8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin. Nginx inside the frontend container proxies
        # /api/* and /api/ws/* to the backend service on the docker network.
        # This makes the app work from ANY hostname (localhost, LAN IP,
        # your server hostname) with zero config.
        REACT_APP_BACKEND_URL: ""
    container_name: cema-frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      # TLS cutover (task #95): host port publishing removed — frontend is
      # only reachable from other containers on the docker network (caddy
      # reverse-proxies to it). No longer directly reachable from the LAN.
      - "3000"

  caddy:
    image: caddy:2-alpine
    container_name: cema-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      # 443 = HTTPS via Caddy's internal CA (tls internal in Caddyfile).
      # 80   = redirect-only to https, per Caddyfile.
      - "${BIND_HOST:-0.0.0.0}:443:443"
      - "${BIND_HOST:-0.0.0.0}:80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # cema_caddy_data holds the internal CA root + issued leaf certs.
      # This MUST persist across container recreation -- regenerating the
      # root would invalidate any copies already distributed to operator
      # machines. Never remove this volume as part of routine cleanup.
      - cema_caddy_data:/data
      - cema_caddy_config:/config

volumes:
  cema_mongo_data:
  cema_caddy_data:
  cema_caddy_config:
